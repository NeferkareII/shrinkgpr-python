[project]
name = "shrinkgpr"
version = "0.1.0.dev0"
description = "Scalable Gaussian process regression with hierarchical shrinkage priors (Python port of the R package shrinkGPR)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Peter Knaus", email = "peter.knaus@wu.ac.at" }]
dependencies = [
    "torch>=2.9",
    "numpy",
    "scipy",
    "pandas",
    "formulaic",
    "tqdm",
    "matplotlib",
]

[project.urls]
Documentation = "https://neferkareii.github.io/shrinkgpr-python/"
Repository = "https://github.com/NeferkareII/shrinkgpr-python"
"R package" = "https://github.com/NeferkareII/shrinkGPR"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-include-markdown-plugin>=7.3.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shrinkgpr"]

# CUDA builds of torch come from the PyTorch index (CUDA 13.0, which has
# Python 3.15 wheels and supports Blackwell GPUs); everything else from PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

# PyYAML (needed by the docs) has no wheels for Python 3.15 yet; build it
# without its C extension, so no compiler is needed
[tool.uv.extra-build-variables]
pyyaml = { PYYAML_FORCE_LIBYAML = "0" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: long-running checks (deselect with -m 'not slow')",
    "r: comparisons against the R package; skipped without R (deselect with -m 'not r')",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "compare"]
