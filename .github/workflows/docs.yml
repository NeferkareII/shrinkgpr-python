# Build the documentation with MkDocs and publish it to GitHub Pages.
# Pull requests only build (in strict mode), pushes to main also deploy.
# In the repository settings, set Pages > Source to "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # mkdocstrings reads the source without importing it, so only the docs
      # group is installed (no torch). Python 3.13 has wheels for everything.
      - name: Build
        run: uv run --python 3.13 --only-group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
